<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>ByteBites - Online Ordering System</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f5f5f5;
    }

    header{
      background:#ff6600;
      color:white;
      padding:20px;
      text-align:center;
    }

    header h1{
      margin-bottom:10px;
    }

    header p{
      font-size:18px;
    }

    .container{
      width:90%;
      margin:auto;
      padding:30px 0;
    }

    .menu-title{
      text-align:center;
      margin-bottom:30px;
      color:#333;
    }

    .menu{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
      gap:20px;
    }

    .card{
      background:white;
      border-radius:10px;
      padding:20px;
      text-align:center;
      box-shadow:0 2px 8px rgba(0,0,0,0.2);
    }

    .card img{
      width:100%;
      height:150px;
      object-fit:cover;
      border-radius:10px;
    }

    .card h3{
      margin-top:15px;
      color:#333;
    }

    .price{
      color:green;
      font-size:20px;
      margin:10px 0;
    }

    .btn{
      background:#ff6600;
      color:white;
      border:none;
      padding:10px 15px;
      border-radius:5px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#e65c00;
    }

    .cart{
      margin-top:40px;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,0.2);
    }

    .cart h2{
      margin-bottom:20px;
      color:#333;
    }

    .cart-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 0;
      border-bottom:1px solid #ddd;
    }

    .remove-btn{
      background:red;
      color:white;
      border:none;
      padding:5px 10px;
      border-radius:5px;
      cursor:pointer;
    }

    .remove-btn:hover{
      background:darkred;
    }

    .total{
      margin-top:20px;
      font-size:22px;
      font-weight:bold;
      text-align:right;
      color:#333;
    }

    .checkout{
      width:100%;
      margin-top:20px;
      background:green;
      color:white;
      border:none;
      padding:15px;
      font-size:18px;
      border-radius:5px;
      cursor:pointer;
    }

    .checkout:hover{
      background:darkgreen;
    }

    footer{
      text-align:center;
      padding:20px;
      background:#222;
      color:white;
      margin-top:40px;
    }

  </style>
</head>

<body>

  <header>
    <h1>ByteBites</h1>
    <p>Online Restaurant Ordering System</p>
  </header>

  <div class="container">

    <h2 class="menu-title">Our Menu</h2>

    <div class="menu">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd" alt="Burger">
        <h3>Cheese Burger</h3>
        <p class="price">$8.99</p>
        <button class="btn" onclick="addToCart('Cheese Burger',8.99)">
          Add to Cart
        </button>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591" alt="Pizza">
        <h3>Pepperoni Pizza</h3>
        <p class="price">$12.99</p>
        <button class="btn" onclick="addToCart('Pepperoni Pizza',12.99)">
          Add to Cart
        </button>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9" alt="Pasta">
        <h3>Chicken Pasta</h3>
        <p class="price">$10.99</p>
        <button class="btn" onclick="addToCart('Chicken Pasta',10.99)">
          Add to Cart
        </button>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1576107232684-1279f390859f" alt="Fries">
        <h3>French Fries</h3>
        <p class="price">$4.99</p>
        <button class="btn" onclick="addToCart('French Fries',4.99)">
          Add to Cart
        </button>
      </div>

    </div>

    <div class="cart">

      <h2>Order Summary</h2>

      <div id="cart-items"></div>

      <div class="total">
        Total: $<span id="total">0.00</span>
      </div>

      <button class="checkout" onclick="checkout()">
        Place Order
      </button>

    </div>

  </div>

  <footer>
    <p>© 2026 ByteBites Restaurant System</p>
  </footer>

  <script>

    let cart = [];
    let total = 0;

    function addToCart(name, price){

      cart.push({
        name:name,
        price:price
      });

      total += price;

      displayCart();
    }

    function displayCart(){

      const cartItems = document.getElementById("cart-items");

      cartItems.innerHTML = "";

      cart.forEach((item,index)=>{

        cartItems.innerHTML += `

          <div class="cart-item">

            <div>
              <h4>${item.name}</h4>
              <p>$${item.price.toFixed(2)}</p>
            </div>

            <button class="remove-btn"
            onclick="removeItem(${index})">
              Remove
            </button>

          </div>

        `;
      });

      document.getElementById("total").innerText =
      total.toFixed(2);
    }

    function removeItem(index){

      total -= cart[index].price;

      cart.splice(index,1);

      displayCart();
    }

    function checkout(){

      if(cart.length === 0){
        alert("Your cart is empty!");
        return;
      }

      alert("Order placed successfully!");

      cart = [];
      total = 0;

      displayCart();
    }

  </script>

</body>
</html>
