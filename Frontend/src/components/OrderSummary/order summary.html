<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ByteBites - Order Summary</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>ByteBites Order Summary</h1>

        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Quantity</th>
                    <th>Price</th>
                </tr>
            </thead>

            <tbody id="orderItems"></tbody>
        </table>

        <div class="total">
            Total: $<span id="totalPrice">0.00</span>
        </div>

        <button onclick="placeOrder()">Place Order</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
